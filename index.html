<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vana Nava Corporate Trip Booking</title>
    
    <!-- Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/th.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/isBetween.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Modal Transitions */
        .modal { transition: opacity 0.2s ease, visibility 0.2s ease; opacity: 0; visibility: hidden; pointer-events: none; z-index: 50; }
        .modal.show { opacity: 1; visibility: visible; pointer-events: auto; }
        .modal-content { transform: scale(0.95); transition: transform 0.2s ease; }
        .modal.show .modal-content { transform: scale(1); }

        /* Calendar Styles */
        .calendar-day { min-height: 120px; background: white; border-right: 1px solid #f3f4f6; border-bottom: 1px solid #f3f4f6; transition: background 0.2s; }
        .calendar-day:hover { background-color: #f9fafb; }
        .calendar-day.other-month { background-color: #f9fafb; color: #d1d5db; }
        .event-pill { font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-bottom: 2px; color: white; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; box-shadow: 0 1px 2px rgba(0,0,0,0.1); transition: transform 0.1s; }
        .event-pill:hover { transform: scale(1.02); filter: brightness(0.95); z-index: 10; position: relative; }
        
        /* Status Colors */
        .status-approved { background-color: #2563eb; } /* Blue */
        .status-active { background-color: #16a34a; }   /* Green */
        .status-maintenance { background-color: #f97316; } /* Orange */
        .status-pending { background-color: #eab308; } /* Yellow */
        .status-rejected { background-color: #ef4444; } /* Red */
        .status-completed { background-color: #0d9488; } /* Teal */
        .status-cancelled { background-color: #9ca3af; text-decoration: line-through; } /* Gray */

        /* Bulk Calendar Styles */
        .bulk-day { height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #e5e7eb; border-radius: 8px; transition: all 0.2s; position: relative; }
        .bulk-day:hover { background-color: #f3f4f6; border-color: #d1d5db; }
        .bulk-day.selected { background-color: #fff7ed; border-color: #f97316; color: #c2410c; font-weight: bold; box-shadow: 0 2px 4px rgba(249, 115, 22, 0.1); }
        .bulk-day.has-conflict { background-color: #fee2e2; border-color: #ef4444; color: #b91c1c; opacity: 0.8; } /* Conflict styling */
        .bulk-header { cursor: pointer; transition: color 0.2s; }
        .bulk-header:hover { color: #f97316; text-decoration: underline; }
        .dot-indicator { width: 6px; height: 6px; border-radius: 50%; position: absolute; bottom: 6px; }
        .dot-conflict { background-color: #ef4444; }
    </style>
</head>
<body class="text-gray-800 antialiased font-sarabun">

    <div id="app" class="min-h-screen flex flex-col"></div>
    <div id="modals-container"></div>
    
    <script>
        // --- INITIAL SETUP ---
        dayjs.extend(window.dayjs_plugin_isBetween);
        dayjs.locale('th');

        // 🔥 CONFIGURATION
        const API_URL = 'https://obtrusive-interlinearly-everette.ngrok-free.dev/api'; 
        const LINE_BOT_ID = '@342rmqlv'; 
        const DEPARTMENTS = ["Admissions", "Executive Office", "Engineer", "Food & Beverage", "Finance", "Housekeeping", "HR & TQM", "Information & Technology", "Operations", "Retails", "Sales"];

        // Axios Configuration
        axios.defaults.headers.common['ngrok-skip-browser-warning'] = 'true';
        axios.interceptors.request.use(config => {
            const token = localStorage.getItem('authToken');
            if (token) config.headers['Authorization'] = `Bearer ${token}`;
            return config;
        }, error => Promise.reject(error));

        axios.interceptors.response.use(response => response, error => {
            if (error.response && (error.response.status === 401 || error.response.status === 403)) {
                if (!error.config.url.includes('/login')) {
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('carBookingUser');
                    location.reload();
                }
            }
            return Promise.reject(error);
        });

        // Global State
        const state = { 
            currentUser: null, 
            viewMode: 'dashboard', 
            bookings: [], 
            cars: [], 
            drivers: [], 
            users: [], 
            stats: {}, 
            currentDate: new Date() 
        };
        let modalData = {};
        let bulkState = { selectedDates: new Set(), currentMonth: dayjs(), resourceType: null, resourceId: null, resourceName: null };

        // Load Session
        try { state.currentUser = JSON.parse(localStorage.getItem('carBookingUser')); } catch (e) { localStorage.clear(); }

        // API Wrapper
        const api = {
            login: (d) => axios.post(`${API_URL}/login`, d),
            fetchData: async () => {
                try {
                    const [c, d, b] = await Promise.all([
                        axios.get(`${API_URL}/cars`).catch(()=>({data:[]})), 
                        axios.get(`${API_URL}/drivers`).catch(()=>({data:[]})), 
                        axios.get(`${API_URL}/bookings`).catch(()=>({data:[]}))
                    ]);
                    
                    state.cars = c.data || []; 
                    state.drivers = d.data || []; 
                    state.bookings = b.data || [];
                    
                    if (state.currentUser?.role === 'admin') {
                        const [u, s] = await Promise.all([
                            axios.get(`${API_URL}/users`).catch(()=>({data:[]})), 
                            axios.get(`${API_URL}/stats`).catch(()=>({data:{}}))
                        ]);
                        state.users = u.data || []; 
                        state.stats = s.data || {};
                    }
                    renderApp(); 
                } catch (e) { console.error("Fetch Error:", e); }
            },
            action: async (m, ep, d) => { 
                try { 
                    const r = await axios[m](`${API_URL}/${ep}`, d); 
                    return { success: true, data: r.data }; 
                } catch (e) { 
                    return { success: false, message: e.response?.data?.message || e.message }; 
                } 
            }
        };

        // --- RENDER MAIN ---
        function renderApp() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            
            if (!state.currentUser) {
                renderLogin(app);
            } else {
                renderNavbar(app);
                renderMainContent(app);
                renderModals();
                lucide.createIcons();
            }
        }

        // 🔥 VANA NAVA THEMED LOGIN UI
        function renderLogin(c) {
            c.innerHTML = `
            <div class="min-h-screen w-full flex items-center justify-center bg-blue-900 relative overflow-hidden fade-in">
                <!-- Background with Blur Overlay -->
                <div class="absolute inset-0 z-0">
                     <img src="./11-12-2025 17-28-23.png" onerror="this.src='https://images.unsplash.com/photo-1575429198097-0414ec08e8cd?q=80&w=2940&auto=format&fit=crop'" 
                         class="w-full h-full object-cover opacity-60 blur-sm scale-105" alt="Background">
                    <div class="absolute inset-0 bg-gradient-to-t from-blue-900/90 to-cyan-800/40"></div>
                </div>

                <!-- Login Card -->
                <div class="bg-white/95 backdrop-blur-md p-8 md:p-10 rounded-2xl shadow-2xl w-full max-w-[400px] relative z-10 border border-white/20">
                    
                    <!-- Header & Logo -->
                    <div class="text-center mb-8">
                        <div class="flex items-center justify-center mb-4 relative">
                             <div class="relative">
                                <i data-lucide="palmtree" class="w-20 h-20 text-blue-600 drop-shadow-sm"></i>
                                <div class="absolute -bottom-2 -right-3 bg-white rounded-full p-1.5 shadow-md border border-gray-100">
                                    <i data-lucide="bus" class="w-8 h-8 text-cyan-500 fill-cyan-50"></i>
                                </div>
                             </div>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Vana Nava Corporate Trip</h1>
                        <p class="text-sm text-gray-500 mt-1 font-medium">ระบบจองรถรับ-ส่งพนักงาน (Vana Nava Water Jungle)</p>
                    </div>

                    <form id="loginForm" class="space-y-5">
                        <!-- Username -->
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1.5 uppercase tracking-wide">รหัสพนักงาน</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                    <i data-lucide="user" class="text-gray-400 w-5 h-5 group-focus-within:text-blue-500 transition-colors"></i>
                                </div>
                                <input name="username" class="w-full border border-gray-300 p-3 pl-11 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50 focus:bg-white placeholder-gray-400" placeholder="ระบุรหัสพนักงาน" required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1.5 uppercase tracking-wide">รหัสผ่าน</label>
                            <div class="relative group">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                    <i data-lucide="lock" class="text-gray-400 w-5 h-5 group-focus-within:text-blue-500 transition-colors"></i>
                                </div>
                                <input type="password" name="password" class="w-full border border-gray-300 p-3 pl-11 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-gray-50 focus:bg-white placeholder-gray-400" placeholder="ระบุรหัสผ่าน" required>
                            </div>
                            <!-- Forgot Password -->
                            <div class="text-right mt-2">
                                <a href="#" onclick="Swal.fire({icon:'info', title:'ลืมรหัสผ่าน?', text:'กรุณาติดต่อแผนก IT หรือผู้ดูแลระบบเพื่อรีเซ็ตรหัสผ่าน'})" class="text-xs text-blue-600 hover:text-blue-800 font-medium hover:underline transition">ลืมรหัสผ่าน?</a>
                            </div>
                        </div>

                        <!-- Button -->
                        <button class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 text-white p-3.5 rounded-xl font-bold hover:shadow-lg hover:from-blue-700 hover:to-cyan-600 transition-all transform active:scale-[0.98] flex items-center justify-center gap-2 mt-2">
                            <span>เข้าสู่ระบบจองรถ</span>
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </form>

                    <div class="mt-8 text-center border-t pt-4">
                        <p class="text-[10px] text-gray-400">© 2024 Vana Nava Corporate Transport System</p>
                    </div>
                </div>
            </div>`;
            
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<span class="animate-spin mr-2"><i data-lucide="loader-2"></i></span> กำลังตรวจสอบ...`;
                lucide.createIcons();

                try {
                    const res = await api.login(Object.fromEntries(new FormData(e.target)));
                    localStorage.setItem('authToken', res.data.token); 
                    localStorage.setItem('carBookingUser', JSON.stringify(res.data.user));
                    state.currentUser = res.data.user;
                    
                    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 1500, timerProgressBar: true });
                    Toast.fire({ icon: 'success', title: `ยินดีต้อนรับคุณ ${res.data.user.firstName}` });
                    
                    if(res.data.user.mustChangePassword) setTimeout(() => openModal('changePwdModal'), 800);
                    else setTimeout(() => api.fetchData(), 800);
                } catch (err) { 
                    Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: err.response?.data?.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง' });
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    lucide.createIcons();
                }
            });
            lucide.createIcons();
        }

        function renderNavbar(c) {
            c.innerHTML += `
            <nav class="bg-white shadow-sm px-6 py-3 flex flex-col md:flex-row justify-between items-center sticky top-0 z-40 border-b border-gray-100">
                <div class="flex items-center gap-3 font-bold text-lg text-gray-800">
                    <div class="bg-gradient-to-tr from-blue-600 to-cyan-500 text-white p-2 rounded-lg shadow-sm"><i data-lucide="bus" class="w-5 h-5"></i></div> 
                    <span>${state.currentUser.role==='admin'?'Admin Panel':'Booking Portal'}</span>
                </div>
                <div class="flex items-center gap-4 mt-2 md:mt-0">
                    ${state.currentUser.role==='admin'?'<span class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-bold border border-purple-200">🛡️ Admin Access</span>':''}
                    <div class="h-6 w-px bg-gray-200 hidden md:block"></div>
                    <button onclick="openLineQR()" class="bg-[#06C755] hover:bg-[#05b34c] text-white px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-2 shadow-sm transition-all transform hover:scale-105">
                        <i data-lucide="bell" class="w-4 h-4"></i> แจ้งเตือน LINE
                    </button>
                    <div class="h-6 w-px bg-gray-200"></div>
                    <div class="flex items-center gap-3">
                        <div class="text-right hidden md:block">
                            <div class="text-sm font-bold text-gray-800">${state.currentUser.firstName} ${state.currentUser.lastName}</div>
                            <div class="text-[10px] text-gray-500 uppercase tracking-wider">${state.currentUser.department}</div>
                        </div>
                        <button onclick="openModal('changePwdModal')" class="p-2 hover:bg-gray-100 rounded-full text-gray-500 transition" title="เปลี่ยนรหัสผ่าน"><i data-lucide="key" class="w-5 h-5"></i></button>
                        <button onclick="logout()" class="p-2 hover:bg-red-50 text-red-500 rounded-full transition" title="ออกจากระบบ"><i data-lucide="log-out" class="w-5 h-5"></i></button>
                    </div>
                </div>
            </nav>`;
        }

        function renderMainContent(c) {
            const main = document.createElement('div'); 
            main.className = "max-w-7xl mx-auto p-4 md:p-6 w-full fade-in pb-24";
            
            // 🔥 UPDATE: Added 'booking' tab for Admin to book for themselves
            const tabs = state.currentUser.role === 'admin' 
                ? [
                    {id:'dashboard', l:'ภาพรวม & จัดการ', i:'layout-dashboard'}, 
                    {id:'booking', l:'จองรถ (ใช้เอง)', i:'plus-circle'}, // <-- New Tab for Admin
                    {id:'history', l:'ประวัติ & รายงาน', i:'file-text'}, 
                    {id:'calendar', l:'ปฏิทินงาน', i:'calendar'}, 
                    {id:'users', l:'ผู้ใช้งาน', i:'users'}
                  ]
                : [
                    {id:'dashboard', l:'จองรถ', i:'plus-circle'}, 
                    {id:'calendar', l:'ปฏิทินรถว่าง', i:'calendar'}
                  ];
            
            main.innerHTML += `
            <div class="flex gap-2 mb-6 overflow-x-auto pb-1 scrollbar-hide">
                ${tabs.map(t => `
                    <button onclick="state.viewMode='${t.id}';renderApp()" 
                        class="flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold transition-all duration-200 whitespace-nowrap ${state.viewMode===t.id ? 'bg-blue-600 text-white shadow-md transform scale-105' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50 hover:border-gray-300'}">
                        <i data-lucide="${t.i}" class="w-4 h-4"></i> ${t.l}
                    </button>
                `).join('')}
            </div>`;
            
            const content = document.createElement('div');
            // 🔥 ROUTER LOGIC
            if(state.viewMode==='dashboard') state.currentUser.role==='admin'?renderAdminDashboard(content):renderUserDashboard(content);
            else if(state.viewMode==='booking') renderUserDashboard(content); // <-- Admin uses User Dashboard here
            else if(state.viewMode==='history') renderHistoryView(content);
            else if(state.viewMode==='calendar') renderCalendar(content);
            else if(state.viewMode==='users') renderUserManagement(content);
            
            main.appendChild(content); 
            c.appendChild(main);

            if(state.currentUser.role==='admin' && state.viewMode==='dashboard') setTimeout(renderCharts, 100);
        }

        // --- DASHBOARDS (Admin/User) ---
        function renderAdminDashboard(c) {
            const pending = state.bookings.filter(b => b.status === 'pending');
            const approved = state.bookings.filter(b => b.status === 'approved'); 
            const today = dayjs();
            const todayJobs = state.bookings.filter(b => dayjs(b.startDate).isSame(today, 'day') && !['cancelled', 'rejected'].includes(b.status)).length;
            const activeCars = new Set(state.bookings.filter(b => b.status === 'active' && b.carId).map(b => b.carId._id || b.carId)).size;
            const activeDrivers = new Set(state.bookings.filter(b => b.status === 'active' && b.driverId).map(b => b.driverId._id || b.driverId)).size;

            c.innerHTML = `
            <div class="space-y-6">
                <!-- Summary Cards -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-l-4 border-l-blue-500">
                        <div class="text-sm text-gray-500 font-medium">งานวันนี้</div>
                        <div class="text-3xl font-bold text-gray-800 mt-1">${todayJobs}</div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-l-4 border-l-green-500">
                        <div class="text-sm text-gray-500 font-medium">รถกำลังวิ่ง</div>
                        <div class="text-3xl font-bold text-gray-800 mt-1">${activeCars} <span class="text-xs font-normal text-gray-400">คัน</span></div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-l-4 border-l-purple-500">
                        <div class="text-sm text-gray-500 font-medium">คนขับปฏิบัติงาน</div>
                        <div class="text-3xl font-bold text-gray-800 mt-1">${activeDrivers} <span class="text-xs font-normal text-gray-400">คน</span></div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-l-4 border-l-yellow-500">
                        <div class="text-sm text-gray-500 font-medium">รออนุมัติ</div>
                        <div class="text-3xl font-bold text-yellow-600 mt-1">${pending.length}</div>
                    </div>
                </div>

                <!-- Charts Area -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border h-80 flex flex-col">
                        <h4 class="font-bold text-gray-700 mb-4 text-sm flex items-center gap-2"><i data-lucide="bar-chart-2" class="w-4 h-4 text-blue-500"></i> สถิติการใช้รถ (ครั้ง)</h4>
                        <div class="relative flex-1"><canvas id="carChart"></canvas></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border h-80 flex flex-col">
                        <h4 class="font-bold text-gray-700 mb-4 text-sm flex items-center gap-2"><i data-lucide="users" class="w-4 h-4 text-green-500"></i> งานคนขับ (ครั้ง)</h4>
                        <div class="relative flex-1"><canvas id="driverChart"></canvas></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border h-80 flex flex-col">
                        <h4 class="font-bold text-gray-700 mb-4 text-sm flex items-center gap-2"><i data-lucide="pie-chart" class="w-4 h-4 text-purple-500"></i> สัดส่วนแผนก</h4>
                        <div class="relative flex-1"><canvas id="deptChart"></canvas></div>
                    </div>
                </div>

                <!-- Main Operations -->
                <div class="grid lg:grid-cols-3 gap-6">
                    <!-- Left: Approvals -->
                    <div class="lg:col-span-2 space-y-6">
                        <!-- Pending List -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border">
                            <h3 class="font-bold mb-4 flex items-center gap-2 text-blue-600"><i data-lucide="clock"></i> รายการรออนุมัติ (${pending.length})</h3>
                            ${pending.length===0 
                                ? '<div class="text-center text-gray-400 py-12 border-2 border-dashed border-gray-100 rounded-xl bg-gray-50 flex flex-col items-center gap-2"><i data-lucide="inbox" class="w-10 h-10 opacity-20"></i> ไม่มีรายการใหม่</div>' 
                                : `<div class="space-y-3">
                                    ${pending.map(b => `
                                        <div class="border border-gray-200 p-5 rounded-xl bg-white shadow-sm hover:shadow-md transition relative overflow-hidden group">
                                            <div class="absolute left-0 top-0 bottom-0 w-1 bg-yellow-400 group-hover:w-2 transition-all"></div>
                                            <div class="flex flex-col md:flex-row justify-between gap-4">
                                                <div class="flex-1">
                                                    <div class="font-bold text-gray-800 text-lg mb-1">${b.remarks}</div>
                                                    <div class="text-sm text-gray-500 flex items-center gap-2">
                                                        <i data-lucide="calendar" class="w-4 h-4 text-blue-500"></i> 
                                                        ${dayjs(b.startDate).format('DD/MM/YY')} ${b.startTime} - ${dayjs(b.endDate).format('DD/MM/YY')} ${b.endTime}
                                                    </div>
                                                    <div class="mt-2 inline-flex items-center gap-1 bg-gray-100 px-2 py-1 rounded text-xs text-gray-600 font-medium">
                                                        <i data-lucide="user" class="w-3 h-3"></i> จองโดย: ${b.userId}
                                                    </div>
                                                </div>
                                                <div class="flex flex-col gap-2 min-w-[220px]">
                                                    <select id="c-${b._id}" class="border border-gray-300 p-2 rounded-lg text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
                                                        <option value="">🚘 เลือกรถ...</option>
                                                        ${state.cars.map(c=>`<option value="${c._id}">${c.name} (${c.plate})</option>`).join('')}
                                                    </select>

        function renderCalendar(c) {
            const now = dayjs(state.currentDate);

            const monthEnd = now.endOf('month');
            const start = monthStart.startOf('week');
            const end = monthEnd.endOf('week');
            let days = []; let d = start;

            while (d.isBefore(end) || d.isSame(end, 'day')) {
                const dateStr = d.format('D');
                const isCurr = d.isSame(dayjs(), 'day');
                const isOther = !d.isSame(monthStart, 'month');
                const events = state.bookings.filter(b => dayjs(b.startDate).isSame(d, 'day') && b.status !== 'cancelled');
                
                days.push(`
                    <div class="calendar-day ${isOther?'other-month':''}">
                        <div class="text-right text-xs font-bold mb-1 p-2">
                            <span class="${isCurr?'bg-blue-600 text-white w-7 h-7 rounded-full inline-flex items-center justify-center shadow-md':''}">${dateStr}</span>
                        </div>
                        <div class="flex-1 overflow-hidden space-y-1 px-1">
                            ${events.map(b => {
                                let display = `${b.startTime} ${b.remarks}`;
                                if(b.status === 'maintenance') {
                                    const res = b.carId ? `🚘 ${b.carId.plate||b.carId.name}` : (b.driverId ? `👨‍✈️ ${b.driverId.name}` : '');
                                    display = `${res} [ปิด] ${b.remarks.replace('[ปิด]', '')}`;
                                }
                                return `<div onclick="showBookingDetails('${b._id}')" class="event-pill status-${b.status} shadow-sm" title="${display}">${display}</div>`;
                            }).join('')}
                        </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border h-full flex flex-col">

                    </div>

                </div>

        // --- MODALS & ACTIONS ---
        async function checkAvail() { const sd=document.getElementById('sd').value, st=document.getElementById('st').value, ed=document.getElementById('ed').value, et=document.getElementById('et').value, badge=document.getElementById('avail-badge'); if(sd&&st&&ed&&et){const r=await api.action('post','check-availability',{startDate:sd,startTime:st,endDate:ed,endTime:et}); if(r.success){document.getElementById('cc').innerText=r.data.availableCars.length;document.getElementById('dc').innerText=r.data.availableDrivers.length;badge.classList.remove('hidden');}}else badge.classList.add('hidden'); }
        async function submitBooking(e){ e.preventDefault(); const btn=e.target.querySelector('button'); const old=btn.innerHTML; btn.innerHTML='Saving...'; btn.disabled=true; const d=Object.fromEntries(new FormData(e.target)); d.useDriver=document.getElementById('ud').checked; const r=await api.action('post','bookings',d); if(r.success){Swal.fire('Success','จองสำเร็จ รออนุมัติ','success'); api.fetchData(); e.target.reset(); document.getElementById('avail-badge').classList.add('hidden');}else{Swal.fire('Error',r.message,'error');} btn.innerHTML=old; btn.disabled=false; }
        
        async function toggleUserRole(id, currentRole) {
            if (id === state.currentUser._id) return Swal.fire('Error', 'คุณไม่สามารถเปลี่ยนสิทธิ์ตัวเองได้', 'error');
            const newRole = currentRole === 'admin' ? 'user' : 'admin';
            const action = newRole === 'admin' ? 'Promote เป็น Admin' : 'Demote เป็น User';
            
            if((await Swal.fire({title:`ยืนยัน ${action}?`, icon:'warning', showCancelButton:true})).isConfirmed){
                await api.action('put', `users/${id}`, { role: newRole });
                api.fetchData();
                Swal.fire('Success', 'อัปเดตสิทธิ์เรียบร้อย', 'success');
            }
        }

        async function approveBooking(id){ const c=document.getElementById(`c-${id}`).value, d=document.getElementById(`d-${id}`).value; if(!c)return Swal.fire('เลือกรถ'); await api.action('put',`bookings/${id}`,{status:'approved',carId:c,driverId:d}); api.fetchData(); }
        async function rejectBooking(id) { const { value: reason } = await Swal.fire({ title: 'ระบุเหตุผล', input: 'text', showCancelButton: true }); if (reason) { await api.action('put', `bookings/${id}`, { status: 'rejected', rejectionReason: reason }); api.fetchData(); } }
        async function cancelBooking(id) { if((await Swal.fire({title:'ยืนยันยกเลิก?',showCancelButton:true})).isConfirmed){ await api.action('put', `bookings/${id}`, { status: 'cancelled', rejectionReason: 'User Cancelled', cancelledBy: state.currentUser.username }); api.fetchData(); } }
        async function startTrip(id){ const b=state.bookings.find(x=>x._id===id); let co=0; if(b.carId){const r=await axios.get(`${API_URL}/cars`);const c=r.data.find(x=>x._id===(b.carId._id||b.carId));if(c)co=c.currentOdometer||0;} const {value:v}=await Swal.fire({title:'เริ่มเดินทาง',html:`<div class="mb-2">ไมล์ปัจจุบัน: <b>${co}</b></div><input id="sw1" type="number" class="swal2-input" value="${co}">`,preConfirm:()=>{const v=document.getElementById('sw1').value;if(v<co)Swal.showValidationMessage('ห้ามต่ำกว่าเดิม');return v;}}); if(v){await api.action('put',`bookings/${id}`,{status:'active',startOdometer:v});api.fetchData();} }
        async function endTrip(id,so){ const {value:f}=await Swal.fire({title:'คืนรถ',html:`<input id="eo" placeholder="ไมล์จบ > ${so}" class="swal2-input"><input id="ef" placeholder="น้ำมัน" class="swal2-input"><input id="et" placeholder="ทางด่วน" class="swal2-input">`,preConfirm:()=>{return {endOdometer:document.getElementById('eo').value, fuelCost:document.getElementById('ef').value, tollCost:document.getElementById('et').value}}}); if(f){if(Number(f.endOdometer)<=Number(so))return Swal.fire('Error','ไมล์จบต้องมากกว่า','error'); await api.action('put',`bookings/${id}`,{status:'completed',...f});api.fetchData();} }

        // Bulk & Utils
        function openBulkMaintenanceModal(type, id, name) { bulkState={...bulkState, resourceType:type, resourceId:id, resourceName:name, selectedDates:new Set()}; state.bookings.forEach(b=>{if(b.status==='maintenance' && ((type==='car' && b.carId?._id===id) || (type==='driver' && b.driverId?._id===id))) bulkState.selectedDates.add(b.startDate)}); document.getElementById('bulk-remark').value=''; renderBulkCalendar(); openModal('bulkMaintenanceModal'); }
        function renderBulkCalendar() { const start=bulkState.currentMonth.startOf('month').startOf('week'), end=bulkState.currentMonth.endOf('month').endOf('week'), grid=document.getElementById('bulk-calendar-grid'); document.getElementById('bulk-month-label').innerText=bulkState.currentMonth.format('MMMM YYYY'); grid.innerHTML=''; let day=start; while(day.isBefore(end)){ const ds=day.format('YYYY-MM-DD'); const isSel=bulkState.selectedDates.has(ds); const isCurr=day.isSame(bulkState.currentMonth,'month'); const conflict=state.bookings.some(b=>b.status!=='maintenance'&&b.status!=='cancelled'&&dayjs(b.startDate).isSame(day,'day')&&((bulkState.resourceType==='car'&&b.carId?._id===bulkState.resourceId)||(bulkState.resourceType==='driver'&&b.driverId?._id===bulkState.resourceId))); const el=document.createElement('div'); el.className=`bulk-day ${isSel?'selected':''} ${conflict?'has-conflict':''} ${!isCurr?'opacity-30':''}`; el.innerHTML=`<span class="text-sm">${day.date()}</span>${conflict?'<div class="dot-indicator dot-conflict"></div>':''}`; el.onclick=()=>toggleBulkDate(ds); grid.appendChild(el); day=day.add(1,'day'); } }
        function toggleBulkDate(d){ if(bulkState.selectedDates.has(d)) bulkState.selectedDates.delete(d); else bulkState.selectedDates.add(d); renderBulkCalendar(); }
        function toggleBulkDayColumn(idx){ let d=bulkState.currentMonth.startOf('month'); while(d.day()!==idx) d=d.add(1,'day'); let all=true, days=[]; while(d.isSame(bulkState.currentMonth,'month')||d.isBefore(bulkState.currentMonth.endOf('month'))){ const s=d.format('YYYY-MM-DD'); days.push(s); if(!bulkState.selectedDates.has(s)) all=false; d=d.add(7,'day'); } days.forEach(x=>{if(all)bulkState.selectedDates.delete(x);else bulkState.selectedDates.add(x)}); renderBulkCalendar(); }
        async function submitBulkMaintenance(){ const rem=document.getElementById('bulk-remark').value||'ปิดปรับปรุง'; const sel=Array.from(bulkState.selectedDates); const curr=state.bookings.filter(b=>b.status==='maintenance'&&((bulkState.resourceType==='car'&&b.carId?._id===bulkState.resourceId)||(bulkState.resourceType==='driver'&&b.driverId?._id===bulkState.resourceId))); const currDs=new Set(curr.map(b=>b.startDate)); const add=sel.filter(d=>!currDs.has(d)), rems=curr.filter(b=>!bulkState.selectedDates.has(b.startDate)); try { for(const b of rems) await api.action('delete',`bookings/${b._id}`); for(const d of add) await api.action('post','bookings',{startDate:d,startTime:'00:00',endDate:d,endTime:'23:59',status:'maintenance',remarks:`[ปิด] ${rem}`,userId:state.currentUser.username,carId:bulkState.resourceType==='car'?bulkState.resourceId:null,driverId:bulkState.resourceType==='driver'?bulkState.resourceId:null}); Swal.fire('Success'); closeModal(); api.fetchData(); } catch(e){Swal.fire('Error',e.message,'error');} }

        function logout(){ localStorage.clear(); state.currentUser=null; renderApp(); }
        function openLineQR(){ if(!state.currentUser?._id) return Swal.fire('Error','User ID not found','error'); api.action('post','generate-link-token',{userId:state.currentUser._id}).then(r=>{if(r.success)Swal.fire({title:'Scan to Link',html:`<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(`https://line.me/R/oaMessage/${LINE_BOT_ID}/?!link ${r.data.token}`)}" class="mx-auto">`})}); }
        function exportCSV(){ const csv="\uFEFFDate,User,Car,Driver,Start,End,Fuel,Toll\n"+state.bookings.map(b=>`${b.startDate},"${b.userId}","${b.carId?.name||'-'}","${b.driverId?.name||'-'}",${b.startOdometer||0},${b.endOdometer||0},${b.fuelCost||0},${b.tollCost||0}`).join('\n'); const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURI(csv); a.download='report.csv'; a.click(); }
        function changeMonth(n){ state.currentDate=dayjs(state.currentDate).add(n,'month').toDate(); renderApp(); }
        function openModal(id){ document.getElementById(id).classList.add('show'); }
        function closeModal(){ document.querySelectorAll('.modal').forEach(e=>e.classList.remove('show')); }
        function renderCharts() { if(!state.stats)return; const ctx1=document.getElementById('carChart'), ctx2=document.getElementById('driverChart'), ctx3=document.getElementById('deptChart'); if(ctx1){Chart.getChart(ctx1)?.destroy();new Chart(ctx1,{type:'bar',data:{labels:state.stats.carStats.map(x=>x.name),datasets:[{label:'Trip',data:state.stats.carStats.map(x=>x.count),backgroundColor:'#3b82f6'}]}});} if(ctx2){Chart.getChart(ctx2)?.destroy();new Chart(ctx2,{type:'bar',data:{labels:state.stats.driverStats.map(x=>x.name),datasets:[{label:'Trip',data:state.stats.driverStats.map(x=>x.count),backgroundColor:'#10b981'}]},options:{indexAxis:'y'}});} if(ctx3){Chart.getChart(ctx3)?.destroy();new Chart(ctx3,{type:'doughnut',data:{labels:state.stats.deptStats.map(x=>x.name),datasets:[{data:state.stats.deptStats.map(x=>x.count),backgroundColor:['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6']}]}});} }
        async function handleChangePwdSubmit(e){ e.preventDefault(); await api.action('post','change-password',{userId:state.currentUser._id,...Object.fromEntries(new FormData(e.target))}); closeModal(); Swal.fire('Success'); }

        // Render Modals
        function renderModals() {
            document.getElementById('modals-container').innerHTML = `
            <div id="changePwdModal" class="modal fixed inset-0 bg-black/70 flex items-center justify-center p-4"><div class="bg-white p-6 rounded-2xl w-full max-w-sm modal-content shadow-2xl"><h3 class="font-bold mb-4 text-lg">เปลี่ยนรหัสผ่าน</h3><form onsubmit="handleChangePwdSubmit(event)" class="space-y-4"><input type="password" name="oldPassword" placeholder="รหัสเดิม" class="w-full border p-3 rounded-lg bg-gray-50" required><input type="password" name="newPassword" placeholder="รหัสใหม่" class="w-full border p-3 rounded-lg bg-gray-50" required><div class="flex justify-end gap-3 mt-6"><button type="button" onclick="closeModal()" class="text-gray-500 hover:bg-gray-100 px-4 py-2 rounded-lg">ยกเลิก</button><button class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">ยืนยัน</button></div></form></div></div>
            <div id="resetPwdModal" class="modal fixed inset-0 bg-black/70 flex items-center justify-center p-4"><div class="bg-white p-6 rounded-2xl w-full max-w-sm modal-content shadow-2xl"><h3 class="font-bold mb-4 text-lg text-yellow-600">รีเซ็ตรหัสผ่าน User</h3><form onsubmit="handleResetPwd(event)" class="space-y-4"><input type="password" name="password" placeholder="ตั้งรหัสผ่านใหม่" class="w-full border p-3 rounded-lg bg-yellow-50" required><div class="flex justify-end gap-3 mt-6"><button type="button" onclick="closeModal()" class="text-gray-500">ยกเลิก</button><button class="bg-yellow-500 text-white px-6 py-2 rounded-lg font-bold">รีเซ็ต</button></div></form></div></div>
            <div id="editUserModal" class="modal fixed inset-0 bg-black/70 flex items-center justify-center p-4"><div class="bg-white p-6 rounded-2xl w-full max-w-md modal-content shadow-2xl"><h3 class="font-bold mb-6 text-lg">แก้ไขข้อมูลผู้ใช้</h3><form onsubmit="handleEditUserSubmit(event)" class="space-y-4"><div class="grid grid-cols-2 gap-4"><input id="eu-fn" name="firstName" placeholder="ชื่อ" class="w-full border p-3 rounded-lg" required><input id="eu-ln" name="lastName" placeholder="สกุล" class="w-full border p-3 rounded-lg" required></div><select id="eu-dept" name="department" class="w-full border p-3 rounded-lg bg-white" required>${DEPARTMENTS.map(d=>`<option value="${d}">${d}</option>`).join('')}</select><input id="eu-email" name="email" placeholder="Email" class="w-full border p-3 rounded-lg"><div class="flex justify-end gap-3 mt-6"><button type="button" onclick="closeModal()" class="text-gray-500">ยกเลิก</button><button class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">บันทึก</button></div></form></div></div>
            <div id="editBookingModal" class="modal fixed inset-0 bg-black/70 flex items-center justify-center p-4"><div class="bg-white p-6 rounded-2xl w-full max-w-md modal-content shadow-2xl"><h3 class="font-bold mb-6 text-blue-600 text-lg">แก้ไขข้อมูลงานจอง</h3><form onsubmit="handleEditBookingSubmit(event)" class="space-y-4"><div><label class="text-xs font-bold text-gray-500">เปลี่ยนรถ</label><select id="eb-car" class="w-full border p-2.5 rounded-lg text-sm"></select></div><div><label class="text-xs font-bold text-gray-500">เปลี่ยนคนขับ</label><select id="eb-driver" class="w-full border p-2.5 rounded-lg text-sm"></select></div><div class="grid grid-cols-2 gap-4"><div><label class="text-xs font-bold text-gray-500">ไมล์เริ่ม</label><input type="number" id="eb-s-odo" class="w-full border p-2 rounded-lg text-sm"></div><div><label class="text-xs font-bold text-gray-500">ไมล์จบ</label><input type="number" id="eb-e-odo" class="w-full border p-2 rounded-lg text-sm"></div></div><div class="grid grid-cols-2 gap-4"><div><label class="text-xs font-bold text-gray-500">น้ำมัน</label><input type="number" id="eb-fuel" class="w-full border p-2 rounded-lg text-sm"></div><div><label class="text-xs font-bold text-gray-500">ทางด่วน</label><input type="number" id="eb-toll" class="w-full border p-2 rounded-lg text-sm"></div></div><div class="flex justify-end gap-3 mt-6"><button type="button" onclick="closeModal()" class="text-gray-500">ยกเลิก</button><button class="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">บันทึก</button></div></form></div></div>
            <div id="bulkMaintenanceModal" class="modal fixed inset-0 bg-black/80 flex items-center justify-center p-4"><div class="bg-white p-6 rounded-2xl w-full max-w-2xl modal-content flex flex-col h-[90vh]"><div class="flex justify-between items-center mb-4"><h3 class="font-bold text-xl text-orange-600">จัดการวันหยุด/ซ่อม</h3><button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x"></i></button></div><div class="flex items-center justify-between mb-4 bg-gray-50 p-2 rounded-lg"><button onclick="bulkState.currentMonth=bulkState.currentMonth.subtract(1,'month');renderBulkCalendar()" class="p-2 hover:bg-white rounded"><i data-lucide="chevron-left"></i></button><span id="bulk-month-label" class="font-bold text-lg"></span><button onclick="bulkState.currentMonth=bulkState.currentMonth.add(1,'month');renderBulkCalendar()" class="p-2 hover:bg-white rounded"><i data-lucide="chevron-right"></i></button></div><div class="grid grid-cols-7 gap-2 mb-2 text-center text-xs font-bold text-gray-500 uppercase"><div onclick="toggleBulkDayColumn(0)" class="bulk-header">อา</div><div onclick="toggleBulkDayColumn(1)" class="bulk-header">จ</div><div onclick="toggleBulkDayColumn(2)" class="bulk-header">อ</div><div onclick="toggleBulkDayColumn(3)" class="bulk-header">พ</div><div onclick="toggleBulkDayColumn(4)" class="bulk-header">พฤ</div><div onclick="toggleBulkDayColumn(5)" class="bulk-header">ศ</div><div onclick="toggleBulkDayColumn(6)" class="bulk-header">ส</div></div><div id="bulk-calendar-grid" class="grid grid-cols-7 gap-2 flex-1 overflow-y-auto p-1"></div><div class="mt-4 pt-4 border-t space-y-3"><input id="bulk-remark" class="w-full border p-3 rounded-lg text-sm" placeholder="สาเหตุ"><div class="flex justify-end gap-3"><button onclick="closeModal()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg">ยกเลิก</button><button onclick="submitBulkMaintenance()" class="px-6 py-2 bg-orange-600 text-white rounded-lg font-bold">บันทึก</button></div></div></div></div>`;
        }
        
        window.onload = () => { renderApp(); if(state.currentUser) api.fetchData(); };
    </script>
</body>
</html>
